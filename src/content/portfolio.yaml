# Portfolio — the photos on /portfolio, in the order they appear under "All".
#
# To edit:
#   - title:    the event name shown under the photo (placeholders for now — swap in real event names).
#   - category: one of Galas, Corporate, Golf, Festivals, Aerial (this drives the filter chips).
#   - image:    a photo in src/assets/photos/ (path is relative to this file).
#   - alt:      a short description of the photo for screen readers and search engines.
#   - id:       any unique slug.
#
# To add a photo: drop the JPEG into src/assets/photos/ and add an entry below.
# Photos are resized and converted to AVIF/WebP automatically at build time.

